# NOTE: renderer intentionally NOT set here — inherit the default (nyx)
# from config/default.yml. Re-declaring `renderer: rasterizer` here used to
# silently disable NYX + the HDRI background. Pass --renderer to override.
# Latest Genesis HD rasterizer collection for the robot-only RGB ranking task.
robot_type: franka
no_avatar: true
side_video: false
video_stride: 40
recording_resolution: [640, 480]
camera_config:
  default:
    w: 640
    h: 480
    fovy: 60
