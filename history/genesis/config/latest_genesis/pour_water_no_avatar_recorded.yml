# NOTE: renderer intentionally NOT set here — inherit the default (nyx)
# from config/default.yml. Re-declaring `renderer: rasterizer` here used to
# silently disable NYX + the HDRI background. Pass --renderer to override.
# Latest Genesis recorded collection gate: GPU rasterizer, Franka, no avatar.
robot_type: franka
no_avatar: true
kinematic_mug_grasp: false
kinematic_mug_transport: false
settle_steps: 5
side_video: false
video_stride: 40
record_stride: 500
record_cameras: [recording]
recording_resolution: [160, 120]
camera_config:
  default:
    w: 160
    h: 120
    fovy: 60
